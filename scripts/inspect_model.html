<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#b8c4d0;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { buildBoeing737 } from '/src/boeing737.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(2);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c4d0);
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 4000);

const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.position.set(40, 60, 50);
scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xaaccff, 1.0);
sun2.position.set(-40, -20, -40);
scene.add(sun2);
scene.add(new THREE.AmbientLight(0xaab8c8, 1.0));

// 地面网格参照（看离地高度）
const grid = new THREE.GridHelper(120, 24, 0x556677, 0x33414f);
grid.position.z = -3.0; // 机身中线离地约 3m，grid 当地面
grid.rotation.x = Math.PI / 2;
scene.add(grid);

const plane = buildBoeing737();
scene.add(plane);

// 手动驱动控制面以检视后缘分段与偏转（与 aircraftModel.js 的真实动画同号）
window.__deflect = (on) => {
  const c = plane.userData.controls || {};
  const D = Math.PI / 180;
  const ail = on ? 16 * D : 0;
  const elev = on ? 14 * D : 0;
  const flap = on ? 30 * D : 0;
  // 副翼差动：左右反号（镜像不翻转 rotation.y 竖直方向，反号=差动）
  if (c.aileronL) c.aileronL.rotation.y = -ail;
  if (c.aileronR) c.aileronR.rotation.y = ail;
  // 升降舵同步：左右同号（俯仰，两侧同向）
  if (c.elevatorL) c.elevatorL.rotation.y = elev;
  if (c.elevatorR) c.elevatorR.rotation.y = elev;
  // 襟翼：两侧对称下偏
  if (c.flapL) c.flapL.rotation.y = -flap;
  if (c.flapR) c.flapR.rotation.y = -flap;
  if (c.rudder) c.rudder.rotation.z = on ? 22 * D : 0; // 方向舵偏转（偏航）
};

const D = 58;
const VIEWS = {
  // 机体: +X=机头, +Y=左翼, +Z=上
  side:        { pos:[0, D, 0],        up:[0,0,1] },   // 正侧视（从左翼方向看）
  'side-low':  { pos:[14, D*0.85, -8], up:[0,0,1] },   // 侧前下方
  top:         { pos:[0, 0, D],        up:[1,0,0] },    // 俯视
  belly:       { pos:[0, 0, -D],       up:[1,0,0] },    // 仰视
  front:       { pos:[D, 0, 0],        up:[0,0,1] },    // 正前（机头朝镜头）
  tail:        { pos:[-D, 0, 6],       up:[0,0,1] },    // 尾视
  'q-front':   { pos:[D*0.7, D*0.55, D*0.35],  up:[0,0,1] }, // 前上四分之三
  'q-rear':    { pos:[-D*0.6, D*0.6, D*0.35],  up:[0,0,1] }, // 后上四分之三
  'eng-close': { pos:[22, 20, -6],     up:[0,0,1], fov:24 }, // 发动机特写
  'nose-close':{ pos:[40, 12, 8],      up:[0,0,1], fov:22 }, // 机头特写
  'htail-close':{ pos:[-30, 14, 9], look:[-17, 0, 2], up:[0,0,1], fov:30 }, // 平尾/升降舵特写
};

window.__setView = (v) => {
  const cfg = VIEWS[v];
  camera.fov = cfg.fov || 32;
  camera.updateProjectionMatrix();
  camera.position.set(...cfg.pos);
  camera.up.set(...cfg.up);
  const t = cfg.look || [0, 0, 0];
  camera.lookAt(...t);
  renderer.render(scene, camera);
};
window.__views = Object.keys(VIEWS);
window.__setView('side');
window.__ready = true;
</script>
</body>
</html>
