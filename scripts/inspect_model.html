<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#8aa0b8;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { buildBoeing737 } from '/src/boeing737.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(2);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8aa0b8);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 2000);

const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.position.set(30, 40, 60);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x99aabb, 1.1));

const plane = buildBoeing737();
scene.add(plane);

// 偏转一点舵面以便检视贴合
const c = plane.userData.controls;
const DEG = Math.PI / 180;
if (c.aileronL) c.aileronL.rotation.y = 12 * DEG;
if (c.aileronR) c.aileronR.rotation.y = 12 * DEG;
if (c.elevatorL) c.elevatorL.rotation.y = -10 * DEG;
if (c.elevatorR) c.elevatorR.rotation.y = -10 * DEG;
if (c.rudder) c.rudder.rotation.z = 14 * DEG;

const D = 60;
window.__setView = (v) => {
  // 机体: +X=机头, +Y=左翼, +Z=上
  if (v === 'belly') {            // 仰视：相机在正下方(-Z)往上看机腹
    camera.position.set(0, 0, -D);
    camera.up.set(1, 0, 0);       // 机头朝画面上方
  } else if (v === 'top') {       // 俯视：相机在正上方(+Z)往下看
    camera.position.set(0, 0, D);
    camera.up.set(1, 0, 0);
  } else if (v === 'tail') {      // 尾视：相机在机尾后方(-X)
    camera.position.set(-D, 0, 8);
    camera.up.set(0, 0, 1);
  } else {                        // 斜下方四分之三视角
    camera.position.set(D * 0.6, -D * 0.5, -D * 0.35);
    camera.up.set(0, 0, 1);
  }
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
};
window.__setView('belly');
window.__ready = true;
</script>
</body>
</html>
