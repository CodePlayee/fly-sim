<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#b8c4d0;overflow:hidden}
#tag{position:fixed;left:8px;top:6px;font:14px monospace;color:#102}</style></head>
<body>
<div id="tag"></div>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { buildBoeing737 } from '/src/boeing737.js';
import { Aircraft } from '/src/aircraft.js';
import { createAircraftModel } from '/src/aircraftModel.js';
import { setOrigin } from '/src/geoUtils.js';

// 与真实场景一致：设定原点，建飞机动力学 + 模型控制器
const AP = { icao:'TEST', lon:0, lat:0, elevation:0, runwayHeading:0 };
setOrigin(AP.lat, AP.lon);

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.setPixelRatio(2);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c4d0);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200000);

const sun = new THREE.DirectionalLight(0xffffff, 2.8); sun.position.set(40,60,50); scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xaaccff, 1.0); sun2.position.set(-40,-20,-40); scene.add(sun2);
scene.add(new THREE.AmbientLight(0xaab8c8, 1.0));

const aircraft = new Aircraft(AP);
const model = createAircraftModel(scene);

// 把飞机送上天，给定空速，便于操纵效能足够
function airborne() {
  aircraft.reset(AP);
  aircraft.onGround = false;
  aircraft.alt = 1500;
  aircraft.speed = 200 / 1.94384;
  aircraft.throttle = 0.85;
  aircraft.pitch = 0; aircraft.roll = 0; aircraft.gamma = 0;
  aircraft.heading = 0;
}
airborne();

// 用真实 input 字段模拟按键；step 多帧让姿态与舵面平滑到位
function setInput({pitch=0, roll=0, yaw=0}) {
  aircraft.input.pitch = pitch;
  aircraft.input.roll = roll;
  aircraft.input.yaw = yaw;
}
function step(frames, dt=1/60) {
  for (let n=0; n<frames; n++) {
    aircraft.update(dt);
    model.update(aircraft.state(), dt);
  }
}

// 相机：从飞机斜后上方看（世界系：北=-Z, 东=+X, 上=+Y）
const VIEWS = {
  chase:  { pos:[28, 16, 48] },
  rear:   { pos:[0, 7, 52] },
  // 正前方：相机在机头前方(-Z)看向飞机。纯俯仰=机头上下、机翼保持水平；
  // 纯横滚=机翼倾斜、机身水平；纯偏航=机头左右偏。三轴互不耦合时一目了然。
  front:  { pos:[0, 2, -70], fov:26 },
  top:    { pos:[0, 70, 0.01], up:[0,0,-1] },
  left:   { pos:[60, 4, 0] },
  // 尾部特写：从左后上方看平尾/升降舵 + 垂尾/方向舵
  tail:   { pos:[34, 14, 30], fov:26 },
  // 尾部正后方特写：看升降舵上下、方向舵左右
  tailrear:{ pos:[0, 5, 40], fov:24 },
  // 尾部侧视特写：从正左侧看平尾，升降舵上/下偏一目了然
  tailside:{ pos:[70, 3, 14], fov:22, look:[0,2,14] },
  // 尾部上方俯视：看方向舵左右、副翼差动
  tailtop: { pos:[0, 55, 14], up:[0,0,-1], fov:24, look:[0,0,14] },
  // 左翼副翼特写：相机与翼面同高、置于翼后方，水平视角看后缘 up/down
  // 左翼在世界 -X 侧；相机略偏左、与翼等高、在翼后(+Z)，看向左外翼
  ailL:    { pos:[-11, 0.5, 30], fov:26, look:[-11, 0.5, 0] },
  // 双翼后方略高视角：同时看左右副翼差动（一上一下）
  ailboth: { pos:[0, 6, 46], fov:30, look:[0, -1, 2] },
  // 后上方 45° 俯视：左右副翼若差动则一片露上表面、一片露下表面，明暗/朝向相反
  rolltop: { pos:[0, 34, 30], up:[0,1,0], fov:34, look:[0, -2, 2] },
};
function aim(v) {
  const c = VIEWS[v];
  camera.fov = c.fov || 35;
  camera.updateProjectionMatrix();
  const center = new THREE.Vector3();
  model.getVisualCenter(center);
  // 尾部视角对准机尾而非几何中心（机尾在模型 -X 方向，世界随航向旋转；hdg=0 时机头 -Z，机尾 +Z）
  const target = center.clone();
  if (c.look) target.set(center.x + c.look[0], center.y + c.look[1], center.z + c.look[2]);
  else if (v === 'tail' || v === 'tailrear') target.z += 14;
  camera.position.set(target.x + c.pos[0], target.y + c.pos[1], target.z + c.pos[2]);
  camera.up.set(...(c.up || [0,1,0]));
  camera.lookAt(target);
}

const tag = document.getElementById('tag');
// 测试场景：每个场景设定一组输入、跑若干帧、记录姿态
window.__scenes = ['neutral','pitch_up','pitch_down','roll_left','roll_right','yaw_left','yaw_right'];
window.__run = (name) => {
  airborne();
  let inp = {};
  if (name === 'pitch_up') inp = { pitch: 1 };
  else if (name === 'pitch_down') inp = { pitch: -1 };
  else if (name === 'roll_left') inp = { roll: -1 };
  else if (name === 'roll_right') inp = { roll: 1 };
  else if (name === 'yaw_left') inp = { yaw: -1 };
  else if (name === 'yaw_right') inp = { yaw: 1 };
  setInput(inp);
  step(45); // ~0.75s 持续输入
  const s = aircraft.state();
  tag.textContent = `${name}  pitch=${s.pitchDeg.toFixed(1)}  roll=${s.rollDeg.toFixed(1)}  hdg=${((s.headingDeg%360+360)%360).toFixed(1)}  inP=${s.inPitch} inR=${s.inRoll} inY=${s.inYaw}`;
  return { pitchDeg:s.pitchDeg, rollDeg:s.rollDeg, headingDeg:(s.headingDeg%360+360)%360, inPitch:s.inPitch, inRoll:s.inRoll, inYaw:s.inYaw };
};
window.__aim = (v) => { aim(v); renderer.render(scene, camera); };
window.__views = Object.keys(VIEWS);

// 直接设定姿态（不靠动力学），单独检验「姿态映射」：纯俯仰应只抬头不滚转，
// 纯横滚应只压坡度不偏航。pitchDeg/rollDeg/headingDeg 直接喂给 model.update。
window.__setAttitude = ({pitch=0, roll=0, hdg=0}) => {
  const st = {
    lon:0, lat:0, alt:1500, fieldElevation:0,
    headingDeg:hdg, headingRad:hdg*Math.PI/180,
    pitchDeg:pitch, rollDeg:roll, speedKt:240, onGround:false,
    inPitch:0, inRoll:0, inYaw:0, throttle:0.85,
  };
  model.update(st, 1/60);
  tag.textContent = `attitude pitch=${pitch} roll=${roll} hdg=${hdg}`;
};

// 隔离测试：冻结成水平姿态，只给操纵输入，让舵面偏转但机身几乎不转，
// 从而单独检视「舵面方向」是否物理正确（与姿态耦合解耦）。
window.__surfOnly = (name) => {
  aircraft.reset(AP);
  aircraft.onGround = false;
  aircraft.alt = 1500; aircraft.speed = 200/1.94384; aircraft.throttle = 0.85;
  aircraft.pitch = 0; aircraft.roll = 0; aircraft.gamma = 0; aircraft.heading = 0;
  let inp = {};
  if (name === 'pitch_up') inp = { pitch: 1 };
  else if (name === 'pitch_down') inp = { pitch: -1 };
  else if (name === 'roll_left') inp = { roll: -1 };
  else if (name === 'roll_right') inp = { roll: 1 };
  else if (name === 'yaw_left') inp = { yaw: -1 };
  else if (name === 'yaw_right') inp = { yaw: 1 };
  setInput(inp);
  // 只驱动舵面动画，强制姿态保持水平（每帧复位姿态）
  for (let n=0;n<30;n++) {
    aircraft.pitch = 0; aircraft.roll = 0; aircraft.gamma = 0; aircraft.heading = 0;
    const st = aircraft.state();
    st.pitchDeg = 0; st.rollDeg = 0; st.headingDeg = 0; st.headingRad = 0;
    model.update(st, 1/60);
  }
  tag.textContent = `${name} [surfOnly]`;
};

window.__run('neutral');
window.__aim('chase');

// 数值探针：返回各舵面后缘尖点世界坐标，明确判断上/下偏与左右差动（不靠肉眼）。
function probeTips() {
  const ctl = model.plane.userData.controls || {};
  model.plane.updateMatrixWorld(true);
  const out = {};
  const teLocal = new THREE.Vector3(-1.5, 0, 0); // 子组局部后缘方向(-x)
  for (const key of ['aileronL','aileronR','elevatorL','elevatorR']) {
    const g = ctl[key];
    if (!g) { out[key] = null; continue; }
    const p = teLocal.clone().applyMatrix4(g.matrixWorld);
    out[key] = +p.y.toFixed(3); // 世界竖直高度
  }
  if (ctl.rudder) {
    const p = new THREE.Vector3(-0.9,0,0).applyMatrix4(ctl.rudder.matrixWorld);
    out.rudderX = +p.x.toFixed(3); // 世界左右
  }
  return out;
}
window.__probe = (name) => {
  window.__surfOnly('neutral');
  const base = probeTips();
  window.__surfOnly(name);
  const def = probeTips();
  const delta = {};
  for (const k of Object.keys(def)) if (base[k] != null && def[k] != null) delta[k] = +(def[k]-base[k]).toFixed(3);
  return { name, delta };
};

window.__ready = true;
</script>
</body>
</html>
